<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wooster Running Routes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{max-width:1200px;margin:auto;padding:18px 20px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}
h1{margin:0;font:700 26px Georgia,serif}.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;max-width:1200px;margin:auto;padding:14px 20px 40px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
aside,.card,.detail{background:var(--card);border:1px solid var(--line);border-radius:12px}aside{padding:14px;align-self:start}
h3{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}h3:first-child{margin-top:0}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.flex{display:flex;gap:6px;flex-wrap:wrap}.flex input{flex:1;min-width:120px}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:600 14px system-ui;cursor:pointer}.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#map{height:420px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px}
.list{display:grid;gap:10px}.card{padding:12px 14px;cursor:pointer}.card:hover,.card.sel{border-color:var(--acc)}
.meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}.note{font-size:12px;color:var(--mute);margin-top:6px}
.detail{padding:14px;margin-bottom:12px}.detail h2{margin:0;font:700 22px Georgia,serif}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}.stats div{font-size:12px;color:var(--mute)}.stats strong{display:block;font-size:19px;color:var(--ink)}
svg.el{width:100%;height:auto;background:var(--bg);border-radius:8px;touch-action:none}.ok{color:#2f8a5f}.empty{padding:26px;text-align:center;color:var(--mute)}
</style></head><body>
<header><div><h1>Wooster Running Routes</h1><div class="note">Filter, explore on the map, download GPX, and add your own.</div></div></header>
<div class="note" id="status" style="max-width:1200px;margin:6px auto 0;padding:0 20px"></div>
<div class="wrap"><aside>
<h3>Distance (mi)</h3><div class="two"><input type="number" id="dmin" placeholder="min" min="0" step="0.5"><input type="number" id="dmax" placeholder="max" min="0" step="0.5"></div>
<h3>Elevation gain (ft)</h3><div class="two"><input type="number" id="emin" placeholder="min" min="0" step="10"><input type="number" id="emax" placeholder="max" min="0" step="10"></div>
<h3>Direction from my point</h3><div class="flex" id="dirs"></div>
<h3>Terrain</h3><div class="flex" id="ters"></div>
<h3>Submitted by</h3><select id="who"></select>
<h3>My point</h3><div class="flex"><input id="addr" placeholder="Street address"><button class="btn" id="find">Find</button></div>
<div class="flex" style="margin-top:6px"><button class="btn ghost" id="pick">Pick on map</button><button class="btn ghost" id="reset">Reset filters</button></div><div class="note" id="ptnote"></div>
<label class="note" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px"><input type="checkbox" id="near" style="width:auto"> Only routes passing within <select id="rad" style="width:auto"><option value="0.1">0.1 mile</option><option value="0.25" selected>¼ mile</option><option value="0.5">½ mile</option><option value="1">1 mile</option></select> of my point</label>
<h3>Add a route</h3><div id="addbox"></div>
</aside><main><div id="map"></div><div id="detail"></div><div class="list" id="list"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var C=window.APP_CONFIG,$=function(i){return document.getElementById(i)},sb,USER=null,ROUTES=[],S={d:{},t:{},sel:null},PT=null,picking=false;
