<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Running Routes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2320;--mute:#68716c;--line:#ddd9cf;--acc:#d9531e}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--card:#1e2421;--ink:#ecefe9;--mute:#97a19b;--line:#333c37;--acc:#ff7a45}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{max-width:1200px;margin:auto;padding:18px 20px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end}
h1{margin:0;font:700 26px Georgia,serif}.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;max-width:1200px;margin:auto;padding:14px 20px 40px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
aside,.card,.detail{background:var(--card);border:1px solid var(--line);border-radius:12px}aside{padding:14px;align-self:start}
h3{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}h3:first-child{margin-top:0}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.flex{display:flex;gap:6px;flex-wrap:wrap}.flex input{flex:1;min-width:120px}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:600 14px system-ui;cursor:pointer}.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#map{height:420px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px}
.list{display:grid;gap:10px}.card{padding:12px 14px;cursor:pointer}.card:hover,.card.sel{border-color:var(--acc)}
.meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}.note{font-size:12px;color:var(--mute);margin-top:6px}
.detail{padding:14px;margin-bottom:12px}.detail h2{margin:0;font:700 22px Georgia,serif}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}.stats div{font-size:12px;color:var(--mute)}.stats strong{display:block;font-size:19px;color:var(--ink)}
svg.el{width:100%;height:auto;background:var(--bg);border-radius:8px;touch-action:none}.empty{padding:26px;text-align:center;color:var(--mute)}
</style></head><body>
<header><div><h1>Local Running Routes</h1><div class="note">Filter, explore on the map, download GPX, and add your own.</div></div><div class="flex" id="auth"></div></header>
<div class="note" id="status" style="max-width:1200px;margin:6px auto 0;padding:0 20px"></div>
<div class="wrap"><aside>
<h3>Distance (mi)</h3><div class="two"><input type="number" id="dmin" placeholder="min" min="0" step="0.5"><input type="number" id="dmax" placeholder="max" min="0" step="0.5"></div>
<h3>Elevation gain (ft)</h3><div class="two"><input type="number" id="emin" placeholder="min" min="0" step="10"><input type="number" id="emax" placeholder="max" min="0" step="10"></div>
<h3>Direction from my point</h3><div class="flex" id="dirs"></div>
<h3>Terrain</h3><div class="flex" id="ters"></div>
<h3>Submitted by</h3><select id="who"></select>
<h3>My point</h3><div class="flex"><input id="addr" placeholder="Street address"><button class="btn" id="find">Find</button></div>
<div class="flex" style="margin-top:6px"><button class="btn ghost" id="pick">Pick on map</button><button class="btn ghost" id="reset">Reset filters</button></div><div class="note" id="ptnote"></div>
<label class="note" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px"><input type="checkbox" id="near" style="width:auto"> Only routes passing within <select id="rad" style="width:auto"><option value="0.25">¼ mile</option><option value="0.5">½ mile</option><option value="1">1 mile</option><option value="2">2 miles</option></select> of my point</label>
<h3>Add a route</h3><div id="addbox"></div>
</aside><main><div id="map"></div><div id="detail"></div><div class="list" id="list"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var C=window.APP_CONFIG,$=function(i){return document.getElementById(i)},sb,USER=null,ROUTES=[],S={d:{},t:{},sel:null},PT=null,picking=false;
var map=L.map('map').setView(C.DEFAULT_CENTER,C.DEFAULT_ZOOM);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var lines=L.layerGroup().addTo(map),ptMk=null,hov=L.circleMarker([0,0],{radius:7,color:'#fff',fillColor:'#1d2320',fillOpacity:1});
function el(t,txt,a){var e=document.createElement(t);if(txt!=null)e.textContent=txt;for(var k in a||{})e[k]=a[k];return e}
function status(t){$('status').textContent=t||''}
function hav(a,b){var R=3958.8,r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function stats(r){var d=0,g=0,last=r.pts[0][2],la=0,lo=0,mn=1e9,mx=-1e9;r.cum=[0];
  r.pts.forEach(function(p,i){la+=p[0];lo+=p[1];mn=Math.min(mn,p[2]);mx=Math.max(mx,p[2]);if(i){d+=hav(r.pts[i-1],p);r.cum.push(d);var de=p[2]-last;if(Math.abs(de)>=3){if(de>0)g+=de;last=p[2]}}});
  r.dist=d;r.gain=g*3.28084;r.mid=[la/r.pts.length,lo/r.pts.length];r.emin=mn;r.emax=mx}
function nearMi(r){var k=Math.cos(PT[0]*Math.PI/180),m=69.17,best=1e9,q=function(p){return[(p[1]-PT[1])*k*m,(p[0]-PT[0])*m]};
  r.pts.forEach(function(p,i){var a=q(p);if(!i){best=Math.hypot(a[0],a[1]);return}var b=q(r.pts[i-1]),dx=a[0]-b[0],dy=a[1]-b[1],L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,-(b[0]*dx+b[1]*dy)/L)):0;best=Math.min(best,Math.hypot(b[0]+t*dx,b[1]+t*dy))});return best}
var ring=null;function drawRing(){if(ring){ring.remove();ring=null}if(PT&&$('near').checked)ring=L.circle(PT,{radius:parseFloat($('rad').value)*1609.34,color:'#2f6f55',weight:1,fillOpacity:.06,interactive:false}).addTo(map)}
function dirOf(m){var dy=m[0]-PT[0],dx=(m[1]-PT[1])*Math.cos(PT[0]*Math.PI/180);if(Math.hypot(dx,dy)<.0015)return'Here';return['N','E','S','W'][Math.round(((Math.atan2(dx,dy)*180/Math.PI+360)%360)/90)%4]}
function chip(box,label,store){var b=el('button',label,{className:'chip'});b.onclick=function(){store[label]=!store[label];b.classList.toggle('on',store[label]);render()};box.appendChild(b)}
function act(o){return Object.keys(o).filter(function(k){return o[k]})}
function facets(){var tb=$('ters');tb.innerHTML='';var ts=[],ws=[];ROUTES.forEach(function(r){if(ts.indexOf(r.terrain)<0)ts.push(r.terrain);if(ws.indexOf(r.submitter)<0)ws.push(r.submitter)});
  ts.sort().forEach(function(t){chip(tb,t,S.t);if(S.t[t])tb.lastChild.classList.add('on')});var w=$('who'),c=w.value;w.innerHTML='';w.appendChild(el('option','Anyone',{value:''}));ws.sort().forEach(function(n){w.appendChild(el('option',n,{value:n}))});w.value=c}
function filtered(){var f=function(i){var v=parseFloat($(i).value);return isNaN(v)?null:v},a=f('dmin'),b=f('dmax'),c=f('emin'),d=f('emax'),who=$('who').value,nr=$('near').checked&&PT?parseFloat($('rad').value):null,ds=act(S.d),ts=act(S.t);
  return ROUTES.filter(function(r){if(PT)r.dir=dirOf(r.mid);return(a==null||r.dist>=a)&&(b==null||r.dist<=b)&&(c==null||r.gain>=c)&&(d==null||r.gain<=d)&&(!who||r.submitter===who)&&(!ts.length||ts.indexOf(r.terrain)>-1)&&(!ds.length||!PT||ds.indexOf(r.dir)>-1)&&(nr==null||(r.nearMi=nearMi(r))<=nr)})}
function render(fit){drawRing();var list=filtered(),L_=$('list');L_.innerHTML='';
  if(!list.length)L_.appendChild(el('div',ROUTES.length?'No routes match these filters.':'No routes yet. Sign in and add the first one!',{className:'empty'}));
  list.forEach(function(r){var d=el('div',null,{className:'card'+(S.sel&&S.sel.id===r.id?' sel':'')});d.appendChild(el('b',r.name));
    d.appendChild(el('div',r.dist.toFixed(1)+' mi · '+Math.round(r.gain)+' ft up · '+r.terrain+(PT?' · '+r.dir+' of point':'')+(PT&&$('near').checked?' · '+r.nearMi.toFixed(2)+' mi from you':'')+' · by '+r.submitter,{className:'meta'}));d.onclick=function(){select(r)};L_.appendChild(d)});
  lines.clearLayers();list.forEach(function(r){var s=S.sel&&S.sel.id===r.id,pl=L.polyline(r.pts.map(function(p){return[p[0],p[1]]}),{color:s?'#d9531e':'#3a7ca5',weight:s?5:3,opacity:s?1:.6}).addTo(lines);pl.bindTooltip(r.name);pl.on('click',function(){select(r)})});
  if(fit&&list.length)map.fitBounds(L.featureGroup(lines.getLayers()).getBounds(),{padding:[20,20]});
  if(S.sel&&list.indexOf(S.sel)<0){S.sel=null;$('detail').innerHTML=''}}
function select(r){S.sel=r;render(false);map.fitBounds(L.polyline(r.pts.map(function(p){return[p[0],p[1]]})).getBounds(),{padding:[30,30]});detail(r);$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function detail(r){var W=640,H=110,span=Math.max(r.emax-r.emin,1),x=function(i){return 6+r.cum[i]/r.dist*(W-12)},y=function(p){return H-6-(p[2]-r.emin)/span*(H-12)},
  d=r.pts.map(function(p,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(p).toFixed(1)}).join(''),D=$('detail');
  D.innerHTML='<div class="detail"><div class="flex" style="justify-content:space-between"><div><h2></h2><div class="meta"><span id="by"></span></div></div><div class="flex"><button class="btn" id="dl">Download GPX</button></div></div><div class="stats"><div><strong>'+r.dist.toFixed(2)+' mi</strong>distance</div><div><strong>'+Math.round(r.gain)+' ft</strong>climb</div><div><strong>'+Math.round(r.emin*3.28084)+'–'+Math.round(r.emax*3.28084)+' ft</strong>elevation</div></div><svg class="el" viewBox="0 0 '+W+' '+H+'"><path d="'+d+'L'+x(r.pts.length-1)+' '+H+'L'+x(0)+' '+H+'Z" fill="#d9531e" fill-opacity=".18"/><path d="'+d+'" fill="none" stroke="#d9531e" stroke-width="2"/></svg><div class="note" id="hint">Slide across the profile to trace the route on the map.</div></div>';
  D.querySelector('h2').textContent=r.name;$('by').textContent=r.terrain+' · submitted by '+r.submitter;
  if(USER&&USER.id===r.user_id){var b=el('button','Delete',{className:'btn ghost'});b.onclick=function(){del(r)};D.querySelector('.flex .flex').appendChild(b)}
  var svg=D.querySelector('svg');function mv(e){var b=svg.getBoundingClientRect(),t=Math.min(Math.max((e.clientX-b.left)/b.width,0),1)*r.dist,i=0;while(i<r.cum.length-1&&r.cum[i]<t)i++;hov.setLatLng([r.pts[i][0],r.pts[i][1]]).addTo(map);$('hint').textContent=r.cum[i].toFixed(2)+' mi · '+Math.round(r.pts[i][2]*3.28084)+' ft'}
  svg.onpointermove=mv;svg.onpointerdown=mv;$('dl').onclick=function(){gpx(r)}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gpx(r){var t='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Local Running Routes" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>'+esc(r.name)+'</name><trkseg>\n'+r.pts.map(function(p){return'<trkpt lat="'+p[0]+'" lon="'+p[1]+'"><ele>'+p[2]+'</ele></trkpt>'}).join('\n')+'\n</trkseg></trk></gpx>',a=el('a',null,{href:URL.createObjectURL(new Blob([t],{type:'application/gpx+xml'})),download:r.name.replace(/[^\w-]+/g,'_')+'.gpx'});document.body.appendChild(a);a.click();a.remove()}
function setPt(lat,lon,msg){PT=[lat,lon];if(ptMk)ptMk.remove();ptMk=L.marker(PT).addTo(map).bindTooltip('My point');$('ptnote').textContent=msg||'';try{localStorage.setItem('rr-pt',JSON.stringify(PT))}catch(e){}render(false)}
async function find(){var a=$('addr').value.trim();if(!a)return;$('ptnote').textContent='Searching…';
  try{var q=a+(C.TOWN_HINT&&a.toLowerCase().indexOf(C.TOWN_HINT.split(',')[0].toLowerCase())<0?', '+C.TOWN_HINT:''),j=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();
    if(!j.length){$('ptnote').textContent='Address not found. Try adding the town, or use Pick on map.';return}
    setPt(+j[0].lat,+j[0].lon,j[0].display_name);map.setView(PT,14)}catch(e){$('ptnote').textContent='Search failed. Try again or use Pick on map.'}}
function authUI(){var A=$('auth');A.innerHTML='';
  if(USER){A.appendChild(el('span',USER.email,{className:'note'}));var o=el('button','Sign out',{className:'btn ghost'});o.onclick=function(){sb.auth.signOut()};A.appendChild(o)}
  else{var i=el('input',null,{type:'email',placeholder:'you@email.com'}),b=el('button','Email me a sign-in link',{className:'btn'});b.onclick=async function(){if(!i.value)return;var r=await sb.auth.signInWithOtp({email:i.value,options:{emailRedirectTo:location.origin+location.pathname}});status(r.error?'Couldn’t send link: '+r.error.message:'Check your email for the sign-in link.')};A.appendChild(i);A.appendChild(b)}
  addBox()}
function addBox(){var B=$('addbox');B.innerHTML='';if(!USER){B.appendChild(el('div','Sign in (top right) to add routes.',{className:'note'}));return}
  var f=el('input',null,{type:'file',accept:'.gpx'}),n=el('input',null,{placeholder:'Route name'}),by=el('input',null,{placeholder:'Your name'}),t=el('select'),b=el('button','Add route',{className:'btn'});
  try{by.value=localStorage.getItem('rr-by')||''}catch(e){}['Road','Trail','Gravel','Track','Mixed'].forEach(function(x){t.appendChild(el('option',x))});
  b.onclick=function(){add(f,n,by,t)};[f,n,by,t,b].forEach(function(e){e.style.marginBottom='6px';B.appendChild(e)})}
async function add(f,n,by,t){if(!f.files[0])return alert('Choose a .gpx file first.');if(!by.value.trim())return alert('Please enter your name.');
  var x=new DOMParser().parseFromString(await f.files[0].text(),'application/xml'),pts=[];
  x.querySelectorAll('trkpt,rtept').forEach(function(p){var e=p.querySelector('ele');pts.push([+p.getAttribute('lat'),+p.getAttribute('lon'),e?+e.textContent:0])});
  if(pts.length<2)return alert('No track points found in that file.');
  var k=Math.ceil(pts.length/500);pts=pts.filter(function(_,i){return i%k===0||i===pts.length-1}).map(function(p){return[+p[0].toFixed(5),+p[1].toFixed(5),Math.round(p[2]*10)/10]});
  var nm=x.querySelector('trk > name,metadata > name'),name=(n.value||(nm&&nm.textContent)||f.files[0].name.replace(/\.gpx$/i,'')).trim().slice(0,80);
  try{localStorage.setItem('rr-by',by.value)}catch(e){}
  var r=await sb.from('routes').insert({name:name,submitter:by.value.trim().slice(0,40),terrain:t.value,pts:pts});
  if(r.error)return alert('Couldn’t save: '+r.error.message);status('Route added.');await load();addBox()}
async function del(r){if(!confirm('Delete “'+r.name+'”?'))return;var e=(await sb.from('routes').delete().eq('id',r.id)).error;if(e)return alert(e.message);S.sel=null;$('detail').innerHTML='';load()}
async function load(first){var r=await sb.from('routes').select('id,user_id,name,submitter,terrain,pts,created_at').order('created_at',{ascending:false});
  if(r.error){status('Couldn’t load routes: '+r.error.message);return}ROUTES=r.data.filter(function(x){return x.pts&&x.pts.length>1});ROUTES.forEach(stats);facets();render(first)}
function init(){
  ['N','E','S','W'].forEach(function(d){chip($('dirs'),d,S.d)});
  ['dmin','dmax','emin','emax','who'].forEach(function(i){$(i).addEventListener('input',function(){render(false)})});
  $('reset').onclick=function(){['dmin','dmax','emin','emax','who'].forEach(function(i){$(i).value=''});S.d={};S.t={};$('near').checked=false;document.querySelectorAll('.chip.on').forEach(function(c){c.classList.remove('on')});render(false)};
  ['near','rad'].forEach(function(i){$(i).addEventListener('change',function(){if($('near').checked&&!PT)$('ptnote').textContent='Enter an address (or pick on the map) first, then this filter will apply.';render(true)})});
  $('find').onclick=find;$('addr').addEventListener('keydown',function(e){if(e.key==='Enter')find()});
  $('pick').onclick=function(){picking=true;$('ptnote').textContent='Click the map to set your point.'};
  map.on('click',function(e){if(picking){picking=false;setPt(e.latlng.lat,e.latlng.lng,'Point set from map.')}});
  try{var p=JSON.parse(localStorage.getItem('rr-pt'));if(p)setPt(p[0],p[1],'Using your saved point.')}catch(e){}
  if(!C.SUPABASE_URL||C.SUPABASE_URL.indexOf('PASTE')===0){status('Setup needed: add your Supabase details to config.js (see README).');return}
  sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);authUI();
  sb.auth.getSession().then(function(r){USER=r.data.session&&r.data.session.user;authUI()});
  sb.auth.onAuthStateChange(function(_e,s){USER=s&&s.user;authUI();if(S.sel)detail(S.sel)});load(true)}
init();
</script></body></html>
